[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-knowledge-agent"
version = "0.1.0"
description = "Agentic RAG Application for developer knowledge scenarios based on LightRAG kernel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring network or real external services (LLM/embedding/rerank/storage)",
]
norecursedirs = [
    "third_party",
    ".venv",
    "build",
    "dist",
    ".git",
]

[tool.ruff]
exclude = ["third_party", ".venv", "build", "dist"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.mypy]
exclude = ["third_party/", ".venv/"]
python_version = "3.10"
strict = true
mypy_path = "src"