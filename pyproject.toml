[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-agentic-rag"
version = "0.1.0"
description = "Polaris Agentic RAG Application based on LightRAG kernel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    #: The Agent LLM adapter talks to DeepSeek over the OpenAI-compatible API.
    #: Declared as a first-class runtime dependency (NOT via LightRAG's
    #: transitive dep) because Stage 4's agent core needs it directly.
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring network or real external services (LLM/embedding/rerank/storage)",
]
norecursedirs = [
    "third_party",
    ".venv",
    "build",
    "dist",
    ".git",
]

[tool.ruff]
exclude = ["third_party", ".venv", "build", "dist"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.mypy]
exclude = ["third_party/", ".venv/"]
#: Analysis runs at 3.12 so typed transitive stubs (numpy via openai) parse.
#: The runtime/language target stays py3.10 -- that is enforced by ruff's
#: `target-version = "py310"`, so mypy 3.12 cannot sneak 3.11+ syntax into src.
python_version = "3.12"
strict = true
mypy_path = "src"

# LightRAG is a vendored submodule without py.typed; analyzing it (and its
# untyped third-party deps such as nano-vectordb) is out of scope. We only
# consume it inside adapters/lightrag, treating it as an untyped boundary.
[[tool.mypy.overrides]]
module = ["lightrag", "lightrag.*"]
follow_imports = "skip"
ignore_missing_imports = true

# openai optionally pulls numpy; its stubs require Python 3.12 while the
# project targets 3.10. numpy is a transitive runtime dep not used by our
# own code, so we treat it as an untyped boundary.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true